name: Alta Resource Technologies
description: >-
  Alta Resource Technologies is a Colorado-based deep-tech company reinventing how
  critical minerals are sourced. It uses advanced biochemistry — customizable, engineered
  proteins licensed from Lawrence Livermore National Laboratory and co-developed with
  researchers at Pennsylvania State University — to selectively separate high-purity rare
  earth elements and other strategic metals from low-grade ores, mining tailings, and
  electronic-waste streams such as end-of-life hard disk drives. The protein-based platform
  binds target elements out of complex, low-concentration solutions with high selectivity
  while dramatically reducing the environmental footprint of conventional mining and
  refining, strengthening U.S. and allied critical-mineral supply chains. Alta emerged from
  stealth in January 2025 and expanded its Series Seed to $10M, backed by DCVC, Voyager
  Ventures, In-Q-Tel, and Orion Industrial Ventures. As a materials-science and biochemistry
  company, Alta does not publish a public developer API, SDKs, or a developer portal; this
  API Evangelist profile carries its identity and website properties only.
